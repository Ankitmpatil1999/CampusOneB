# Prometheus scrape configuration for RingPe (Phase 9.5). Written as a file: Prometheus is not
# installed on this workstation — load it on the monitoring host once hosting is decided.
# /metrics answers only from INTERNAL_ALLOWLIST addresses: add the Prometheus host there.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: ringpe-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api-1.internal:3000'] # one entry per API instance
  - job_name: ringpe-worker
    metrics_path: /metrics
    static_configs:
      - targets: ['worker.internal:3001'] # WORKER_HEALTH_PORT
  - job_name: ringpe-readiness
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://api-1.internal:3000/health/ready']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox.internal:9115 # the Prometheus blackbox exporter
